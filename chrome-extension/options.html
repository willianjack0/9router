<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9router Extension Settings</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --emerald: #10b981;
      --rose: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      padding: 30px 20px;
      font-size: 14px;
      display: flex;
      justify-content: center;
    }

    .settings-container {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .logo-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .help-text {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      cursor: pointer;
    }

    .checkbox-field input {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 18px;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .toast {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 12px;
      display: none;
    }

    .toast.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .toast.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="settings-container">
    <div class="header">
      <div class="logo-badge">9</div>
      <div>
        <h1>9router Configuration</h1>
        <p class="help-text">Set your 9router instance details and monitoring preferences.</p>
      </div>
    </div>

    <form id="settingsForm">
      <div class="field">
        <label for="baseUrl">9router Base URL</label>
        <input type="text" id="baseUrl" placeholder="https://apia.fishlab.com.br" required>
        <p class="help-text">Public or local URL of your 9router instance.</p>
      </div>

      <div class="field">
        <label for="apiKey">API Key / Bearer Token</label>
        <input type="password" id="apiKey" placeholder="sk-..." required>
        <p class="help-text">Generated 9router key or NINEROUTER_EXT_API_KEY master token.</p>
      </div>

      <div class="field">
        <label for="refreshInterval">Background Refresh Interval</label>
        <select id="refreshInterval">
          <option value="10">Every 10 seconds</option>
          <option value="30" selected>Every 30 seconds (Recommended)</option>
          <option value="60">Every 1 minute</option>
          <option value="300">Every 5 minutes</option>
          <option value="0">Disabled (Manual refresh only)</option>
        </select>
      </div>

      <div class="field">
        <label for="badgeMode">Extension Badge Display</label>
        <select id="badgeMode">
          <option value="status" selected>Status text (OK / WARN / CRIT)</option>
          <option value="exhausted_count">Number of exhausted accounts</option>
        </select>
      </div>

      <div class="field">
        <label class="checkbox-field">
          <input type="checkbox" id="enableNotifications" checked>
          <span>Show desktop notification when accounts run out of quota</span>
        </label>
      </div>

      <div id="toastMessage" class="toast"></div>

      <div class="actions">
        <button type="button" id="testBtn" class="btn btn-secondary">Test Connection</button>
        <button type="submit" id="saveBtn" class="btn btn-primary">Save Settings</button>
      </div>
    </form>
  </div>

  <script src="options.js"></script>
</body>
</html>
